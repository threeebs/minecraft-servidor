services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile.minecraft

    image: mahal-minecraft-fabric:26.2
    container_name: minecraft-server
    restart: unless-stopped

    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"

    environment:
      EULA: "TRUE"

      # Plataforma
      TYPE: "FABRIC"
      VERSION: "26.2"
      GUI: "FALSE"

      # Recursos
      MEMORY: "4G"
      MAX_PLAYERS: "10"

      # Gameplay
      MODE: "survival"
      HARDCORE: "FALSE"
      DIFFICULTY: "normal"
      FORCE_GAMEMODE: "TRUE"

      # Acesso
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"

      # Servidor
      MOTD: "Servidor Mahal | Minecraft 26.2"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"

      # RCON usado pelo painel
      ENABLE_RCON: "TRUE"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

    volumes:
      - ./data:/data
